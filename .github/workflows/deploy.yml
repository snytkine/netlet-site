# Deploys the site to GitHub Pages.
# Runs ONLY for commits on `main` (direct pushes or merges of other branches into main).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual re-runs from the Actions tab; the `if` guards below still restrict them to main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Defence in depth: never build for anything but main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the local dev environment (Node 24 / npm 11) that generates
          # package-lock.json. Older npm versions can resolve optional deps
          # differently and make `npm ci` fail with a lockfile-out-of-sync error.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # GitHub Pages has no SPA fallback: serving index.html as 404.html makes deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
